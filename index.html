<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFI MODS - Game Vault</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #07090e;
            color: #f1f5f9;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid #1e293b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        header h1 {
            color: #38bdf8;
            font-size: 2.6rem;
            margin-bottom: 0.2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.55rem 1.25rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .social-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .social-btn.telegram {
            background-color: #229ed9;
        }
        .social-btn.youtube {
            background-color: #ef4444;
        }
        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 0.8rem 1.2rem;
            border-radius: 25px;
            border: 1px solid #334155;
            background-color: #111827;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .game-card {
            background-color: #111827;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
            transition: transform 0.3s ease, border-color 0.3s;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
        }
        .game-card.patched {
            border-color: #ef4444;
            background-color: #1a0f13;
        }
        .game-info {
            padding: 1.6rem;
        }
        .badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        .badge.patched-badge {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .game-info h3 {
            color: #f8fafc;
            font-size: 1.35rem;
            margin-bottom: 0.4rem;
        }
        .game-info p {
            color: #94a3b8;
            font-size: 0.92rem;
            margin-bottom: 1.2rem;
        }
        .meta {
            font-size: 0.82rem;
            color: #cbd5e1;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }
        .download-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            text-align: center;
            padding: 0.8rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.2s;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        .download-btn:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }
        .download-btn.patched-btn {
            background: linear-gradient(135deg, #991b1b, #7f1d1d);
            color: #fca5a5;
            cursor: not-allowed;
            box-shadow: 0 4px 12px rgba(153, 27, 27, 0.4);
        }
        
        .download-page-container {
            max-width: 550px;
            margin: 3.5rem auto;
            padding: 2.2rem;
            background-color: #111827;
            border-radius: 20px;
            border: 1px solid #1f2937;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .download-page-container.patched-page {
            border-color: #ef4444;
            background-color: #1a0f13;
        }
        .download-page-container h2 {
            color: #38bdf8;
            margin-bottom: 0.6rem;
            font-size: 1.9rem;
        }
        .download-page-container.patched-page h2 {
            color: #f87171;
        }
        .download-page-container p {
            color: #94a3b8;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }
        
        /* GET ZIP PASS Button Box */
        .password-box {
            background-color: #1e293b;
            border: 1px dashed #38bdf8;
            padding: 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .get-pass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 0.8rem;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .get-pass-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .timer-box {
            font-size: 3rem;
            font-weight: 800;
            color: #fbbf24;
            margin: 1rem 0;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }
        .get-link-btn {
            display: inline-block;
            width: 100%;
            background-color: #1f2937;
            color: #6b7280;
            text-align: center;
            padding: 0.95rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.15rem;
            pointer-events: none;
            transition: all 0.3s ease;
            border: 1px solid #374155;
        }
        .get-link-btn.active {
            background: linear-gradient(135deg, #10b981, #047857);
            color: white;
            pointer-events: auto;
            border-color: #34d399;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }
        .get-link-btn.patched-blocked {
            background: linear-gradient(135deg, #7f1d1d, #450a0a);
            color: #fca5a5;
            border-color: #991b1b;
            box-shadow: none;
            font-size: 1rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 1.5rem;
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            color: #94a3b8;
            font-size: 1.1rem;
            padding: 2rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            border-top: 1px solid #111827;
            margin-top: 3rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <h1>RAFI MODS</h1>
        <p>Your ultimate destination for exclusive Free Fire Max APKs</p>
        
        <div class="social-buttons">
            <a href="https://t.me/FCMoDMen" class="social-btn telegram" target="_blank">

            </a>
            <a href="https://youtube.com/@apnar_channel" class="social-btn youtube" target="_blank">
                <i class="fab fa-youtube"></i> Subscribe YouTube
            </a>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Free Fire Max mods...">
        </div>
    </header>

    <div class="container" id="appContent"></div>

    <footer>
        <p>&copy; 2026 RAFI MODS. All rights reserved.</p>
    </footer>

    <script>
        const allGames = [
            {
                id: 1,
                name: "Free Fire Max - OB55 Proxy Menu",
                category: "Proxy Mod",
                size: "480 MB",
                version: "OB55",
                desc: "Advanced proxy mode menu built for OB55 update with anti-ban protection and safe features.",
                link: "https://www.mediafire.com/file/m4lyetth83b9b5q/100%+BODY+HEADSHOT+64Bit.7z/file",
                passLink: "https://arolinks.com/u3JfND", // Ekhane apnar onno website/telegram link dite parben
                patched: true
            },
            {
                id: 2,
                name: "Free Fire Max - OB55 Body Headshot",
                category: "Headshot Mod",
                size: "460 MB",
                version: "OB55",
                desc: "Special OB55 build optimized for high accuracy body headshot locking and smooth aim.",
                link: "https://www.mediafire.com/file/m4lyetth83b9b5q/100%+BODY+HEADSHOT+64Bit.7z/file",
                passLink: "https://arolinks.com/u3JfND",
                patched: false
            },
            {
                id: 3,
                name: "Free Fire Max - OB55 Drip client",
                category: "all feature",
                size: "490 MB",
                version: "OB55",
                desc: "OB55 edition featuring ultra-fast drag headshot sensitivity and custom crosshair.",
                link: "https://www.mediafire.com/file/example3/file",
                passLink: "https://t.me/FCMoDMen",
                patched: true
            },
            {
                id: 4,
                name: "Free Fire Max - OB54 Drip Client",
                category: "Drip Client",
                size: "450 MB",
                version: "OB54",
                desc: "Exclusive OB54 Drip Client packed with custom themes, emotes unlocker, and glowing effects.",
                link: "https://www.mediafire.com/file/example4/file",
                passLink: "https://t.me/FCMoDMen",
                patched: true
            },
            {
                id: 5,
                name: "Free Fire Max - OB54 Proxy Menu Pro",
                category: "Proxy Mod",
                size: "475 MB",
                version: "OB54",
                desc: "Standard OB54 proxy mode menu with bypass tools and fast network response.",
                link: "https://www.mediafire.com/file/example5/file",
                passLink: "https://t.me/FCMoDMen",
                patched: true
            },
            {
                id: 6,
                name: "Free Fire Max - OB54 Drag Headshot",
                category: "Drag Mod",
                size: "440 MB",
                version: "OB54",
                desc: "Classic OB54 drag headshot config loaded directly into client for seamless gameplay.",
                link: "https://www.mediafire.com/file/example6/file",
                passLink: "https://t.me/FCMoDMen",
                patched: true
            }
        ];

        const appContent = document.getElementById('appContent');
        const mainHeader = document.getElementById('mainHeader');

        function renderHome(gamesToDisplay) {
            if (mainHeader) mainHeader.style.display = 'block';
            if (!gamesToDisplay || gamesToDisplay.length === 0) {
                appContent.innerHTML = `<div class="loading">No mods found!</div>`;
                return;
            }

            let html = '';
            gamesToDisplay.forEach(game => {
                const cardClass = game.patched ? 'game-card patched' : 'game-card';
                const badgeClass = game.patched ? 'badge patched-badge' : 'badge';
                const badgeText = game.patched ? '🔴 Patched (Outdated)' : game.category;
                const btnClass = game.patched ? 'download-btn patched-btn' : 'download-btn';
                const btnText = game.patched ? '<i class="fas fa-ban"></i> Patched / Unavailable' : '<i class="fas fa-download"></i> Download APK';

                html += `
                    <div class="${cardClass}">
                        <div class="game-info">
                            <span class="${badgeClass}">${badgeText}</span>
                            <h3>${game.name}</h3>
                            <div class="meta"><i class="fas fa-hdd"></i> Size: ${game.size} &nbsp;|&nbsp; <i class="fas fa-code-branch"></i> Version: ${game.version}</div>
                            <p>${game.desc}</p>
                            <button class="${btnClass}" onclick="goToDownloadPage(${game.id})">${btnText}</button>
                        </div>
                    </div>
                `;
            });
            appContent.innerHTML = html;
        }

        function goToDownloadPage(gameId) {
            const game = allGames.find(g => g.id === gameId);
            if (!game) return;

            if (mainHeader) mainHeader.style.display = 'none';
            
            if (game.patched) {
                appContent.innerHTML = `
                    <div class="download-page-container patched-page">
                        <h2>${game.name}</h2>
                        <div class="meta" style="margin-bottom: 1rem;"><span class="badge patched-badge">🔴 Patched</span> &bull; Version: ${game.version} &bull; Size: ${game.size}</div>
                        <p>${game.desc}</p>
                        
                        <hr style="border: 0; border-top: 1px solid #3b1116; margin: 1.5rem 0;">
                        
                        <div style="font-size: 3.5rem; color: #ef4444; margin: 1rem 0;">
                            <i class="fas fa-triangle-exclamation"></i>
                        </div>
                        <p style="color: #f87171; font-weight: bold; font-size: 1.1rem; margin-bottom: 1.5rem;">
                            This game is patched. Download unavailable!
                        </p>
                        
                        <div class="get-link-btn patched-blocked">
                            <i class="fas fa-ban"></i> Link Blocked by Admin
                        </div>
                        
                        <br>
                        <a href="#" class="back-btn" onclick="goHome(event)"><i class="fas fa-arrow-left"></i> Back to Home</a>
                    </div>
                `;
            } else {
                appContent.innerHTML = `
                    <div class="download-page-container">
                        <h2>${game.name}</h2>
                        <div class="meta" style="margin-bottom: 1rem;"><span class="badge">${game.category}</span> &bull; Version: ${game.version} &bull; Size: ${game.size}</div>
                        <p>${game.desc}</p>
                        
                        <!-- GET ZIP PASS Button -->
                        <div class="password-box">
                            <a href="${game.passLink}" target="_blank" class="get-pass-btn">
                                <i class="fas fa-key"></i> GET ZIP PASS
                            </a>
                        </div>
                        
                        <hr style="border: 0; border-top: 1px solid #1f2937; margin: 1.2rem 0;">
                        
                        <p style="margin-bottom: 0.2rem; color: #94a3b8; font-weight: 500;">Your download link is ready in:</p>
                        <div class="timer-box" id="timer">10</div>
                        
                        <a href="${game.link}" id="getLinkBtn" class="get-link-btn" target="_blank"><i class="fas fa-lock"></i> Please Wait...</a>
                        
                        <br>
                        <a href="#" class="back-btn" onclick="goHome(event)"><i class="fas fa-arrow-left"></i> Back to Home</a>
                    </div>
                `;
                startCountdown();
            }
        }

        function startCountdown() {
            let timeLeft = 10;
            const timerElement = document.getElementById('timer');
            const getLinkBtn = document.getElementById('getLinkBtn');

            const countdown = setInterval(() => {
                timeLeft--;
                if (timerElement) timerElement.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    if (timerElement) timerElement.textContent = "Ready!";
                    if (getLinkBtn) {
                        getLinkBtn.innerHTML = `<i class="fas fa-rocket"></i> Download Now 🚀`;
                        getLinkBtn.classList.add('active');
                    }
                }
            }, 1000);
        }

        function goHome(e) {
            e.preventDefault();
            renderHome(allGames);
        }

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const searchText = e.target.value.toLowerCase();
                const filtered = allGames.filter(g => 
                    g.name.toLowerCase().includes(searchText) || 
                    g.category.toLowerCase().includes(searchText)
                );
                renderHome(filtered);
            });
        }

        renderHome(allGames);
    </script>
</body>
</html>
