                            <h3>${game.name}</h3>
                            <div class="meta"><i class="fas fa-hdd"></i> Size: ${game.size} &nbsp;|&nbsp; <i class="fas fa-code-branch"></i> Version: ${game.version}</div>
                            <p>${game.desc}</p>
                            <button class="download-btn" onclick="goToDownloadPage(${game.id})"><i class="fas fa-download"></i> Download APK</button>
                        </div>
                    </div>
                `;
            });
            appContent.innerHTML = html;
        }

        function goToDownloadPage(gameId) {
            const game = allGames.find(g => g.id === gameId);
            if (!game) return;

            mainHeader.style.display = 'none';
            
            appContent.innerHTML = `
                <div class="download-page-container">
                    <h2>${game.name}</h2>
                    <div class="meta" style="margin-bottom: 1rem;"><span class="badge">${game.category}</span> &bull; Version: ${game.version} &bull; Size: ${game.size}</div>
                    <p>${game.desc}</p>
                    
                    <hr style="border: 0; border-top: 1px solid #1f2937; margin: 1.5rem 0;">
                    
                    <p style="margin-bottom: 0.2rem; color: #94a3b8; font-weight: 500;">Your download link is ready in:</p>
                    <div class="timer-box" id="timer">10</div>
                    
                    <a href="${game.link}" id="getLinkBtn" class="get-link-btn" target="_blank"><i class="fas fa-lock"></i> Please Wait...</a>
                    
                    <br>
                    <a href="#" class="back-btn" onclick="goHome(event)"><i class="fas fa-arrow-left"></i> Back to Home</a>
                </div>
            `;

            startCountdown(game.link);
        }

        function startCountdown(downloadUrl) {
            let timeLeft = 10;
            const timerElement = document.getElementById('timer');
            const getLinkBtn = document.getElementById('getLinkBtn');

            const countdown = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerElement.textContent = "Ready!";
                    getLinkBtn.innerHTML = `<i class="fas fa-rocket"></i> Download Now 🚀`;
                    getLinkBtn.classList.add('active');
                }
            }, 1000);
        }

        function goHome(e) {
            e.preventDefault();
            renderHome(allGames);
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchText = e.target.value.toLowerCase();
                    const filtered = allGames.filter(g => 
                        g.name.toLowerCase().includes(searchText) || 
                        g.category.toLowerCase().includes(searchText)
                    );
                    renderHome(filtered);
                });
            }
        }

        renderHome(allGames);
        setupSearch();
    </script>
</body>
</html>
